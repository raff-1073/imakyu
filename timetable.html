<script>
"use strict";
// 路線ファイル（data/json）と路線カラー（乗換案内のバッジ色に合わせる）
const LINE_FILES = [
    { file: "中央高速線.json", color: "#e60012" },
    { file: "今宮高速線.json", color: "#7f3f98" },

    { file: "水上線・西田線.json", color: "#00b7b7" },
    { file: "青山線.json", color: "#3050c0" },
    { file: "秋川本線.json", color: "#b03060" },
    { file: "田原線.json", color: "#008080" },
    { file: "北倉線.json", color: "#607d8b" },
    { file: "多田本線.json", color: "#795548" },
    { file: "山北線.json", color: "#558b2f" },
    { file: "新沢線.json", color: "#00838f" },
    { file: "河田線.json", color: "#6a1b9a" },
    { file: "和阪線.json", color: "#a67c00" },
    { file: "浜田本線.json", color: "#00695c" },
    { file: "扶桑本線.json", color: "#ad1457" },
    { file: "浜見線.json", color: "#4e342e" },
    { file: "森浜線.json", color: "#33691e" },
    { file: "赤倉本線.json", color: "#d81b60" },
    { file: "赤倉港線.json", color: "#283593" },
    { file: "新拠点線.json", color: "#4527a0" },
    { file: "小岩線・小阪線.json", color: "#6d4c41" },
    { file: "拠点本線.json", color: "#0277bd" },
    { file: "都心環状線.json", color: "#9e9d24" },
    { file: "吹雪環状線.json", color: "#3949ab" },
    { file: "赤津線.json", color: "#006064" },
    { file: "河津高速線・拠点高速線.json", color: "#bf360c" },
    { file: "横倉空港線（横倉）.json", color: "#7a6a00" },
    { file: "磯電線・技輪ドーム線・拠点小岩ライン.json", color: "#ad1457" },
    { file: "臨海線.json", color: "#00838f" }
];
const TYPE_COLORS = {
    "すいせい": "#d9001b", "てんりゅう": "#009b8f", "うみかぜ": "#1b9bd8", "しまなみ": "#f08300",
    "うみ": "#1b9bd8", "きぼ": "#f08300",
    "各停": "#5b7a99", "普通": "#5b7a99", "臨時": "#8d6e63",
    "準急": "#7ab648", "急行": "#3f9e4d", "通急": "#e07b00", "快急": "#a05fc0",
    "特急": "#d9001b", "臨特急": "#d9001b", "ライ": "#d9001b", "ライナー": "#d9001b",
    "寝特": "#7f3f98", "臨寝特": "#7f3f98"
};
const LOCAL_TYPES = ["各停", "普通"];
const cache = {};
let stationEntries = [];
const state = { station: null, line: null, dir: null };

function isValidTime(str) { return /^\d{1,2}:\d{2}$/.test(str || ""); }
function parseTime(str) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(str || "");
    return m ? (+m[1]) * 60 + (+m[2]) : null;
}
function loadScript(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
    });
}
let trainsFallbackPromise = null;
function loadTrainsFallback() {
    if (window.IMAKYU_TRAINS) return Promise.resolve();
    if (!trainsFallbackPromise) trainsFallbackPromise = loadScript("data/js/trains.js");
    return trainsFallbackPromise;
}
async function loadLine(file) {
    if (cache[file]) return cache[file];
    try {
        const r = await fetch("data/json/" + file);
        if (!r.ok) throw new Error("fetch failed");
        const j = await r.json();
        cache[file] = j.trains;
    } catch (e) {
        await loadTrainsFallback();
        const all = window.IMAKYU_TRAINS[file];
        cache[file] = Array.isArray(all) ? all : all.trains;
    }
    return cache[file];
}

// 運転日（臨時列車・運休）の設定：同梱の operations.json と、管理ページで
// この端末に追加した分（localStorage）を合わせて使う。
let OPS = { rules: [], extraTrains: [] };
let OPS_DATE = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
let opsReady = null;
function loadOperations() {
    if (!opsReady) {
        opsReady = (async () => {
            try {
                const r = await fetch("data/json/operations.json");
                if (r.ok) { const d = await r.json(); OPS = { rules: d.rules || [], extraTrains: d.extraTrains || [] }; }
            } catch (e) {
                try {
                    await loadScript("data/js/operations.js");
                    const d = window.IMAKYU_OPERATIONS;
                    if (d) OPS = { rules: d.rules || [], extraTrains: d.extraTrains || [] };
                } catch (_) {}
            }
            try {
                const local = JSON.parse(localStorage.getItem("imakyu_ops_local") || "null");
                if (local) { OPS.rules = OPS.rules.concat(local.rules || []); OPS.extraTrains = OPS.extraTrains.concat(local.extraTrains || []); }
            } catch (_) {}
        })();
    }
    return opsReady;
}
function opsDateMatch(dates, dateStr) {
    for (const d of dates || []) {
        if (typeof d !== "string") continue;
        if (d.includes("/")) { const p = d.split("/"); if (dateStr >= p[0] && dateStr <= p[1]) return true; }
        else if (d === dateStr) return true;
    }
    return false;
}
function trainRunsOnLine(train, lineName, dateStr) {
    let onlyDates = null;
    for (const rule of OPS.rules || []) {
        if (rule.line && rule.line !== lineName) continue;
        if (rule.id && String(train.id) !== String(rule.id)) continue;
        if (rule.name && train.name !== rule.name) continue;
        if (rule.type && train.type !== rule.type) continue;
        if (!rule.id && !rule.name && !rule.type) continue;
        if (rule.mode === "except") { if (opsDateMatch(rule.dates, dateStr)) return false; }
        else onlyDates = (onlyDates || []).concat(rule.dates || []);
    }
    if (onlyDates) return opsDateMatch(onlyDates, dateStr);
    return true;
}
const visCache = {};
async function visibleLineTrains(file) {
    const key = file + "@" + OPS_DATE;
    if (visCache[key]) return visCache[key];
    await loadOperations();
    const lineName = file.replace(/\.json$/, "");
    const raw = await loadLine(file);
    const list = raw.filter(t => trainRunsOnLine(t, lineName, OPS_DATE));
    for (const extra of OPS.extraTrains || []) {
        if (extra.line === lineName && opsDateMatch(extra.dates, OPS_DATE)) {
            list.push({ id: extra.id || "ops-extra", type: extra.type || "", name: extra.name || "", direction: extra.direction || "", stops: extra.stops || [] });
        }
    }
    visCache[key] = list;
    return list;
}

async function loadStations() {
    try {
        const r = await fetch("data/json/stations.json");
        if (!r.ok) throw new Error("fetch failed");
        stationEntries = await r.json();
    } catch (e) {
        await loadScript("data/js/stations.js");
        stationEntries = window.IMAKYU_STATIONS || [];
    }
}

// 直通列車の対応付け（路線をまたいで運行される同一列車）
// 判定ルール：(1) 名前付き列車は、同名で同じ駅に接続し、時刻差が最小（30分以内）で一意な相手と対応付ける
//             (2) 今宮本線⇔黒崎小岩ラインの普通同士は、今宮で同時刻に接続するものだけを対応付ける
//             （それ以外の普通・各停は別列車として扱う）
let throughNext = {}, throughPrev = {}, throughLineTrains = {}, throughReady = null;
function buildThroughMaps(byLine) {
    const items = [];
    for (const line of Object.keys(byLine)) {
        byLine[line].forEach((t, idx) => {
            const evs = [];
            for (const s of t.stops) { const m = parseTime(s.time); if (m !== null) evs.push({ station: s.station, t: m }); }
            if (line === "和阪線" && t.name === "天空") return;
            if (evs.length >= 2) items.push({ line, idx, train: t, fs: evs[0].station, fm: evs[0].t, ls: evs[evs.length - 1].station, lm: evs[evs.length - 1].t });
        });
    }
    const byFirst = new Map();
    for (const it of items) {
        const k = it.fs + "|" + it.fm;
        if (!byFirst.has(k)) byFirst.set(k, []);
        byFirst.get(k).push(it);
    }
    const key = it => it.line + "#" + it.idx;
    const next = {}, prev = {};
    const link = (a, b) => { next[key(a)] = key(b); prev[key(b)] = key(a); };
    for (const a of items) {
        const nm = a.train.name;
        if (!nm || next[key(a)]) continue;
        let best = [];
        const maxGap = nm === "天空" ? 90 : 30;
        for (let gap = 0; gap <= maxGap; gap++) {
            const cs = (byFirst.get(a.ls + "|" + ((a.lm + gap) % 1440)) || []).filter(b => b.line !== a.line && b.train.name === nm && !prev[key(b)]);
            if (cs.length) { best = cs; break; }
        }
        if (best.length === 1) link(a, best[0]);
    }
    for (const a of items) {
        if (a.train.name || a.ls !== "今宮" || a.train.type !== "普通" || next[key(a)]) continue;
        if (a.line !== "今宮本線" && a.line !== "黒崎小岩ライン") continue;
        const other = a.line === "今宮本線" ? "黒崎小岩ライン" : "今宮本線";
        const cs = (byFirst.get("今宮|" + a.lm) || []).filter(b => b.line === other && !b.train.name && b.train.type === "普通" && !prev[key(b)]);
        if (cs.length === 1) link(a, cs[0]);
    }
    return { next, prev };
}
async function ensureThrough() {
    if (!throughReady) {
        throughReady = (async () => {
            const byLine = {};
            for (const lf of LINE_FILES) byLine[lf.file.replace(/\.json$/, "")] = await visibleLineTrains(lf.file);
            throughLineTrains = byLine;
            const maps = buildThroughMaps(byLine);
            throughNext = maps.next; throughPrev = maps.prev;
            window.IMAKYU_THROUGH = maps;
        })();
    }
    return throughReady;
}
function chainEnd(lineName, idx, map) {
    let cur = { line: lineName, idx };
    const seen = new Set();
    while (true) {
        const k = cur.line + "#" + cur.idx;
        if (seen.has(k)) break;
        seen.add(k);
        const nk = map[k];
        if (!nk) break;
        const sep = nk.lastIndexOf("#");
        cur = { line: nk.slice(0, sep), idx: +nk.slice(sep + 1) };
    }
    return cur;
}
function trueDestOf(lineName, trains, idx) {
    const end = chainEnd(lineName, idx, throughNext);
    const t = (throughLineTrains[end.line] || trains)[end.idx];
    if (!t) return "";
    const evs = t.stops.filter(s => isValidTime(s.time));
    return evs.length ? evs[evs.length - 1].station : "";
}
function trueOriginOf(lineName, trains, idx) {
    const end = chainEnd(lineName, idx, throughPrev);
    const t = (throughLineTrains[end.line] || trains)[end.idx];
    if (!t) return "";
    const evs = t.stops.filter(s => isValidTime(s.time));
    return evs.length ? evs[0].station : "";
}

// 路線の駅並び（下り方向の順）。位置情報ページと同じ決め方
function canonicalStations(trains) {
    let best = null;
    for (const t of trains) {
        if (!best || t.stops.length > best.stops.length ||
            (t.stops.length === best.stops.length && t.direction === "下り" && best.direction !== "下り")) best = t;
    }
    if (!best) return [];
    let rows = best.stops.map(s => s.station);
    if (best.direction === "上り") rows = rows.slice().reverse();
    return rows.filter((s, i) => i === 0 || s !== rows[i - 1]);
}

function trainLabel(train, lineName) {
    const ty = train.type || "", nm = train.name || "";
    if (lineName === "中央高速線") {
        const id = parseInt(train.id, 10);
        if (!isNaN(id) && id >= 1000 && id <= 4999) return nm + (id % 1000) + "号";
    }
    if (nm && ty && nm.indexOf(ty) !== 0) return ty + " " + nm;
    return nm || ty;
}
function typeColor(train) {
    if (TYPE_COLORS[train.name]) return TYPE_COLORS[train.name];
    if (TYPE_COLORS[train.type]) return TYPE_COLORS[train.type];
    return "#607d8b";
}
function typeTag(train, lineName) {
    if ((lineName === "中央高速線" || lineName === "今宮高速線") && train.name) return train.name;
    return train.type || "";
}
// 分の文字色：各停・普通は黒、それ以外（優等・愛称列車）は種別色
function minuteColor(train) {
    if (LOCAL_TYPES.includes(train.type)) return "";
    return typeColor(train);
}

// その駅・その方面の発車一覧。終着（到着のみ）の列車と通過列車は含めない
// dest は直通先までたどった本当の終着駅、origin は直通元までたどった本当の始発駅
function departuresFor(trains, station, direction, lineName) {
    const out = [];
    trains.forEach((t, idx) => {
        if (t.direction !== direction) return;
        if (t.type === "回送" || t.type === "試運転") return;
        const events = [];
        for (const s of t.stops) if (isValidTime(s.time)) events.push(s);
        let depIdx = -1;
        for (let i = 0; i < events.length - 1; i++) if (events[i].station === station) depIdx = i;
        if (depIdx < 0) return;
        const mins = parseTime(events[depIdx].time);
        const ownDest = events[events.length - 1].station;
        out.push({
            sortMin: (mins < 240 ? mins + 1440 : mins),
            hour: Math.floor(mins / 60),
            minute: mins % 60,
            dest: lineName ? (trueDestOf(lineName, trains, idx) || ownDest) : ownDest,
            ownDest,
            origin: lineName ? trueOriginOf(lineName, trains, idx) : "",
            legFrom: events[0].station,
            train: t
        });
    });
    out.sort((a, b) => a.sortMin - b.sortMin);
    return out;
}

const $ = id => document.getElementById(id);
let seq = 0;

function stationLines(name) {
    const entries = stationEntries.filter(e => e.name === name);
    const lines = [];
    for (const e of entries) for (const ln of e.lines) if (!lines.includes(ln)) lines.push(ln);
    return { entries, lines };
}

async function selectStation(name) {
    const token = ++seq;
    state.station = name; state.line = null; state.dir = null;
    $("dirStep").innerHTML = "";
    $("ttResult").innerHTML = "";
    const { entries, lines } = stationLines(name);
    if (!entries.length) {
        $("lineStep").innerHTML = '<div class="tt-empty">「' + name + '」という駅は見つかりませんでした。</div>';
        return;
    }
    const usable = lines.filter(ln => LINE_FILES.some(x => x.file === ln + ".json"));
    $("lineStep").innerHTML = '<div class="tt-step-label"><span class="tt-step-station">' + name + "駅</span>　路線を選んでください</div>" +
        '<div class="tt-chips">' + usable.map(ln => {
            const lf = LINE_FILES.find(x => x.file === ln + ".json");
            return '<button type="button" class="tt-chip" data-line="' + ln + '"><span class="tt-chip-dot" style="background:' + lf.color + '"></span>' + ln + "</button>";
        }).join("") + "</div>";
    $("lineStep").querySelectorAll(".tt-chip").forEach(btn => {
        btn.addEventListener("click", () => selectLine(btn.dataset.line));
    });
    if (usable.length === 1) selectLine(usable[0]);
}

async function selectLine(lineName) {
    const token = ++seq;
    state.line = lineName; state.dir = null;
    $("ttResult").innerHTML = "";
    $("lineStep").querySelectorAll(".tt-chip").forEach(b => b.classList.toggle("selected", b.dataset.line === lineName));
    const lf = LINE_FILES.find(x => x.file === lineName + ".json");
    $("dirStep").innerHTML = '<div class="tt-step-label">方面を選んでください</div><div class="tt-chips"><span style="color:#567;font-size:13.5px">読み込み中…</span></div>';
    const trains = await visibleLineTrains(lf.file);
    if (token !== seq) return;
    const rows = canonicalStations(trains);
    const dirs = [
        { dir: "下り", terminal: rows[rows.length - 1] },
        { dir: "上り", terminal: rows[0] }
    ];
    $("dirStep").innerHTML = '<div class="tt-step-label">方面を選んでください</div><div class="tt-chips">' +
        dirs.map(d => {
            const n = departuresFor(trains, state.station, d.dir).length;
            return '<button type="button" class="tt-chip" data-dir="' + d.dir + '"' + (n ? "" : " disabled") + ">" +
                d.dir + "　" + (d.terminal || "") + '方面<span class="tt-chip-count">' + n + "本</span></button>";
        }).join("") + "</div>";
    $("dirStep").querySelectorAll(".tt-chip").forEach(btn => {
        btn.addEventListener("click", () => selectDir(btn.dataset.dir));
    });
}

async function selectDir(dir) {
    const token = ++seq;
    state.dir = dir;
    $("dirStep").querySelectorAll(".tt-chip").forEach(b => b.classList.toggle("selected", b.dataset.dir === dir));
    const lf = LINE_FILES.find(x => x.file === state.line + ".json");
    const trains = await visibleLineTrains(lf.file);
    await ensureThrough();
    if (token !== seq) return;
    renderBoard(trains, lf);
}

function renderBoard(trains, lf) {
    const rows = canonicalStations(trains);
    const terminal = state.dir === "下り" ? rows[rows.length - 1] : rows[0];
    const deps = departuresFor(trains, state.station, state.dir, state.line);
    if (!deps.length) {
        $("ttResult").innerHTML = '<div class="tt-empty">この方面に発車する列車はありません。</div>';
        return;
    }
    // 行き先マーク：最頻の行き先は無印、それ以外は駅名の頭文字（重なる場合は2文字）
    const destCount = new Map();
    for (const d of deps) destCount.set(d.dest, (destCount.get(d.dest) || 0) + 1);
    const primaryDest = [...destCount].sort((a, b) => b[1] - a[1])[0][0];
    const otherDests = [...destCount.keys()].filter(d => d !== primaryDest);
    const firstCharCount = new Map();
    for (const d of otherDests) firstCharCount.set(d[0], (firstCharCount.get(d[0]) || 0) + 1);
    const markOf = d => d === primaryDest ? "" : (firstCharCount.get(d[0]) > 1 ? d.slice(0, 2) : d[0]);
    const byHour = new Map();
    for (const dep of deps) {
        if (!byHour.has(dep.hour)) byHour.set(dep.hour, []);
        byHour.get(dep.hour).push(dep);
    }
    let html = '<div class="board">' +
        '<div class="board-head" style="background:' + lf.color + '">' +
        '<span class="bh-line">' + state.line + '</span>' +
        '<span class="bh-dir">' + state.dir + "　" + (terminal || "") + '方面</span>' +
        '<span class="bh-tt">TIMETABLE</span></div>' +
        '<div class="board-station"><span class="bs-name">' + state.station + '</span><span class="bs-sub">駅　発車時刻表</span></div>';
    for (const [hour, list] of byHour) {
        html += '<div class="b-hour"><div class="b-hour-num"><b>' + hour + '</b><small>時</small></div><div class="b-mins">';
        for (const dep of list) {
            const mc = minuteColor(dep.train);
            const mark = markOf(dep.dest);
            const originNote = dep.origin && dep.origin !== dep.legFrom ? "・" + dep.origin + "始発" : "";
            html += '<span class="b-min"' + (mc ? ' style="color:' + mc + '"' : "") + ' title="' +
                trainLabel(dep.train, state.line) + " " + dep.dest + "行 " + dep.hour + ":" + String(dep.minute).padStart(2, "0") + "発" + originNote + '">' +
                (mark ? '<span class="b-mark">' + mark + "</span>" : "") +
                String(dep.minute).padStart(2, "0") + "</span>";
        }
        html += "</div></div>";
    }
    // 凡例
    const typeSet = new Map();
    for (const dep of deps) {
        const tag = typeTag(dep.train, state.line);
        if (tag && !LOCAL_TYPES.includes(dep.train.type) && !typeSet.has(tag)) typeSet.set(tag, typeColor(dep.train));
    }
    let legend = '<div class="board-legend"><div class="bl-row"><span><b>無印</b>＝' + primaryDest + "行</span>" +
        otherDests.map(d => "<span><b>" + markOf(d) + "</b>＝" + d + "行</span>").join("") + "</div>";
    if (typeSet.size) {
        legend += '<div class="bl-row">' + [...typeSet].map(([tag, c]) =>
            '<span class="bl-type"><i style="background:' + c + '"></i><span style="color:' + c + ';font-weight:700">' + tag + "</span></span>").join("") +
            '<span>※色付きの数字は各種別列車の発車時刻です</span></div>';
    }
    if (deps.some(d => d.dest !== d.ownDest)) {
        legend += '<div class="bl-row"><span>※行き先は直通先の最終駅を表示しています</span></div>';
    }
    legend += "</div>";
    html += legend + "</div>";
    $("ttResult").innerHTML = html;
}

// 駅名サジェスト（乗換案内と同じ、前方一致を優先）
function stationSuggestions(q) {
    if (!q) return [];
    const seen = new Map();
    for (const e of stationEntries) {
        if (!seen.has(e.name)) seen.set(e.name, []);
        for (const ln of e.lines) if (!seen.get(e.name).includes(ln)) seen.get(e.name).push(ln);
    }
    const all = [...seen].map(([name, lines]) => ({ name, lines }));
    const pre = all.filter(x => x.name.startsWith(q));
    const sub = all.filter(x => !x.name.startsWith(q) && x.name.includes(q));
    return pre.concat(sub).slice(0, 12);
}
function setupPicker() {
    const input = $("stInput"), box = $("stSuggest");
    let activeIdx = -1;
    function close() { box.innerHTML = ""; activeIdx = -1; }
    function show() {
        const items = stationSuggestions(input.value.trim());
        activeIdx = -1;
        box.innerHTML = items.map(x => '<div class="tt-suggest-item" data-name="' + x.name + '">' + x.name +
            '<span class="tt-suggest-lines">' + x.lines.join("・") + "</span></div>").join("");
    }
    function go() {
        const name = input.value.trim();
        if (name) selectStation(name);
    }
    input.addEventListener("input", show);
    input.addEventListener("focus", show);
    box.addEventListener("click", e => {
        const item = e.target.closest(".tt-suggest-item");
        if (!item) return;
        input.value = item.dataset.name;
        close();
        selectStation(item.dataset.name);
    });
    input.addEventListener("keydown", e => {
        const items = [...box.querySelectorAll(".tt-suggest-item")];
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!items.length) return;
            activeIdx = e.key === "ArrowDown" ? Math.min(activeIdx + 1, items.length - 1) : Math.max(activeIdx - 1, 0);
            items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
        } else if (e.key === "Enter") {
            if (activeIdx >= 0 && items[activeIdx]) {
                input.value = items[activeIdx].dataset.name;
                close();
                selectStation(input.value);
            } else { close(); go(); }
        } else if (e.key === "Escape") close();
    });
    document.addEventListener("click", e => { if (!e.target.closest(".tt-controls")) close(); });
    $("ttBtn").addEventListener("click", go);
}

(async function init() {
    try {
        await loadStations();
    } catch (e) {
        $("ttStatus").textContent = "駅データを読み込めませんでした。";
        return;
    }
    $("ttStatus").textContent = "";
    const dateEl = $("ttDate");
    if (dateEl) {
        dateEl.value = OPS_DATE;
        dateEl.addEventListener("change", () => {
            if (!dateEl.value) return;
            OPS_DATE = dateEl.value;
            throughReady = null;
            if (state.dir) selectDir(state.dir);
            else if (state.line) selectLine(state.line);
            else if (state.station) selectStation(state.station);
        });
    }
    setupPicker();
    const q = new URLSearchParams(location.search).get("station");
    if (q) {
        $("stInput").value = q;
        selectStation(q);
    }
})();
</script>
